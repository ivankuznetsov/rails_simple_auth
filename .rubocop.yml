plugins:
  - rubocop-rails
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

# Gemspec and configuration have long lines
Layout/LineLength:
  Max: 120
  Exclude:
    - '*.gemspec'
    - 'lib/rails_simple_auth/configuration.rb'
    - 'lib/generators/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - '*.gemspec'
    - 'lib/rails_simple_auth/models/concerns/**/*'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/rails_simple_auth/routes.rb'
    - 'lib/rails_simple_auth/configuration.rb'
    - 'lib/rails_simple_auth/controllers/concerns/**/*'
    - 'lib/rails_simple_auth/models/concerns/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/rails_simple_auth/routes.rb'
    - 'lib/rails_simple_auth/configuration.rb'
    - 'lib/rails_simple_auth/controllers/concerns/**/*'
    - 'lib/rails_simple_auth/models/concerns/**/*'
    - 'lib/generators/**/*'
    - 'app/controllers/**/*'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/rails_simple_auth/models/concerns/**/*'
    - 'lib/rails_simple_auth/controllers/concerns/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/rails_simple_auth/models/concerns/**/*'

# Flash messages are intentionally hardcoded - apps can customize via I18n
Rails/I18nLocaleTexts:
  Enabled: false

Rails/RefuteMethods:
  Exclude:
    - 'test/test_helper.rb'

Rails/DynamicFindBy:
  Exclude:
    - 'test/**/*'

# Uses lambda for dynamic class resolution from config
Rails/ReflectionClassName:
  Exclude:
    - 'lib/rails_simple_auth/models/session.rb'

Style/SafeNavigationChainLength:
  Enabled: false

# Generator test files use Capybara naming convention
Naming/PredicatePrefix:
  Exclude:
    - 'test/generator_test_files/**/*'

# Generator test files are templates, not part of gem test suite
Minitest/MultipleAssertions:
  Max: 5

# Allow generated test files to have longer files
Metrics/ModuleLength:
  Exclude:
    - 'test/generator_test_files/**/*'
